services:
  crawl4ai:
    image: unclecode/crawl4ai:basic-amd64
    container_name: crawl4ai
    env_file:
      - .env
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}
    ports:
      - "11235:11235"
    volumes:
      - crawl4ai-volume:/dev/shm
    network_mode: "host"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

volumes:
  crawl4ai-volume:
